<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://*.supabase.co data: blob:; connect-src 'self' https://*.supabase.co; frame-src 'self'; font-src 'self'; object-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#26151A" />
    <title>BLITZ Admin</title>
    <link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header id="topbar" class="topbar" hidden>
      <div class="topbar-inner">
        <a class="brand" href="#/">
          <img src="../assets/logo/blitz-logo.png" alt="" width="56" height="32" />
          <span>Admin</span>
        </a>
        <nav id="mainnav" class="mainnav" aria-label="Sections"></nav>
        <div class="topbar-user">
          <button
            id="user-menu-btn"
            type="button"
            class="user-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="user-card"
            aria-label="Account menu"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20a8 8 0 0 1 16 0" />
            </svg>
          </button>
          <div id="user-card" class="user-card" role="region" aria-label="Account" hidden>
            <div class="user-card-head">
              <span id="whoami" class="user-card-email"></span>
              <span id="whoami-role" class="user-card-role"></span>
            </div>
            <a id="user-account-link" class="user-card-link" href="#/account">Account settings</a>
            <button id="signout" type="button" class="btn btn--danger user-card-signout">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <p class="loading">Loading…</p>
      <noscript><p class="notice">This admin panel needs JavaScript.</p></noscript>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="dialog" class="dialog"></dialog>

    <script defer src="../js/config.js"></script>
    <script defer src="../js/content-map.js"></script>
    <script defer src="../js/data.js"></script>
    <script defer src="vendor/supabase.js"></script>
    <script defer src="../js/error-catalog.js"></script>
    <script defer src="../js/error-handler.js"></script>
    <script defer src="event-validator.js"></script>
    <script defer src="admin-core.js"></script>
    <script defer src="database-diagnostics.js"></script>
    <script defer src="operation-status.js"></script>
    <script defer src="event-template.js"></script>
    <script defer src="admin-forms.js"></script>
    <script defer src="admin-app.js"></script>
  </body>
</html>
