
name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Query BLITZ site content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu

          STATUS=$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/site_content" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}')

          if [ "$STATUS" != "200" ]; then
            echo "Supabase request failed: HTTP $STATUS"
            exit 1
          fi

          echo "Supabase site_content() request succeeded."
