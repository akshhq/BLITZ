name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every third day
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public content (keeps the project active)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set" >&2; exit 1
          fi
          status=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/site_content" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status"
          test "$status" = "200"
          grep -q '"events"' /tmp/out.json
