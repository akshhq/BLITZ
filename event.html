    <meta property="og:title" content="Events | BLITZ Computer Science Society" />
    <meta
      property="og:description"
      content="Explore BLITZ events, workshops, competitions, speaker sessions, and technical festivals."
    />
    <meta property="og:image" content="https://keshav.du.ac.in/blitz/assets/og.png" />
    <meta property="og:url" content="https://keshav.du.ac.in/blitz/event.html" />
    <meta property="og:site_name" content="BLITZ Keshav Mahavidyalaya" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Events | BLITZ Computer Science Society" />
    <meta
      name="twitter:description"
      content="Explore BLITZ events, workshops, competitions, speaker sessions, and technical festivals."
    />
    <meta name="twitter:image" content="https://keshav.du.ac.in/blitz/assets/og.png" />

      rel="stylesheet"
    />
  </head>
  <body class="event-page">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a id="nav-brand" class="nav-brand" href="index.html#home" aria-label="BLITZ home">
          <img class="nav-brand-logo" src="assets/logo/blitz-logo.png" alt="" width="56" height="32" decoding="async" />
        </a>
        <button
          id="menu-toggle"
          class="nav-menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-navigation-links"
          aria-label="Open navigation menu"
        >
          <span></span><span></span><span></span>
        </button>
        <div id="primary-navigation-links" class="nav-links">
          <a href="index.html#home" class="nav-link">Home</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="index.html#events" class="nav-link is-active" aria-current="page">Events</a>
          <a href="index.html#team" class="nav-link">Team</a>
          <a href="index.html#gallery" class="nav-link">Gallery</a>
          <a href="index.html#collaborations" class="nav-link">Collaborations</a>
          <a href="index.html#contact" class="nav-link">Contact</a>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <section class="event-launchpad" aria-labelledby="lp-title">
        <div class="lp-shell">
          <p id="lp-title" class="lp-title">BLITZ / EVENT LAUNCHPAD</p>
          <div class="lp-search" role="search">
            <svg class="lp-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
            <input id="lp-search" type="search" placeholder="Search events" autocomplete="off" spellcheck="false" aria-label="Search events" />
            <button id="lp-search-clear" class="lp-search-clear" type="button" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7L7 17"></path></svg>
            </button>
            <span id="lp-search-more" class="lp-search-more" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="9.5"></circle><circle class="d" cx="8" cy="12" r="1"></circle><circle class="d" cx="12" cy="12" r="1"></circle><circle class="d" cx="16" cy="12" r="1"></circle></svg>
            </span>
          </div>
          <div id="lp-state" class="blitz-state" role="status" aria-live="polite" hidden></div>
          <div id="event-launchpad-pages" class="lp-pages" aria-label="Events"></div>
          <div id="lp-dots" class="lp-dots" hidden></div>
        </div>

        <div id="event-windows" class="lp-windows"></div>

        <div id="lp-dock" class="lp-dock" role="toolbar" aria-label="Open events">
          <a class="lp-dock-item lp-dock-home" href="index.html" aria-label="BLITZ home"><img src="assets/logo/blitz-logo.png" alt="" width="40" height="23" /></a>
          <span class="lp-dock-sep" aria-hidden="true"></span>
          <div id="lp-dock-windows" class="lp-dock-windows"></div>
          <span class="lp-dock-sep lp-dock-sep--windows" aria-hidden="true"></span>
          <button id="lp-dock-trash" class="lp-dock-item lp-dock-trash" type="button" aria-label="Close all event windows" disabled>
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M12 14h24l-2 26a3 3 0 01-3 2.8H17a3 3 0 01-3-2.8zM9 14h30M19 14v-3a2 2 0 012-2h6a2 2 0 012 2v3M20 21v14M28 21v14"></path></svg>
          </button>
        </div>
      </section>
    </main>

    <script src="error-catalog.js"></script>
    <script src="error-handler.js"></script>
    <script src="data.js"></script>
    <script src="config.js"></script>
    <script src="content-map.js"></script>
    <script src="content-loader.js"></script>
    <script src="event-renderer.js"></script>
    <script src="script.js"></script>
    <script src="event-page.js"></script>
  </body>
</html>
